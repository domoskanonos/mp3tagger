[project]
name = "radio-ripper-tag"
version = "3.7.1"
description = "Webradio-Tagger — AcoustID-Fingerprinting, iTunes-Enrichment, ID3v2-Tagging"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Radio-Ripper Contributors" }]
keywords = ["webradio", "tagging", "id3", "mp3", "acoustid", "fingerprint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "httpx>=0.27.0",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    "pydub>=0.25.1",
    "pydantic>=2.7.0",
    "pyacoustid>=1.2.0",
    "watchdog>=4.0.0",
]

[project.scripts]
radio-ripper = "radio_ripper.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "acoustid",
    "httpx",
    "mutagen.*",
    "pydantic",
    "PIL.*",
    "pydub.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["radio_ripper"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
]

[tool.semantic_release]
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = [
    "src/radio_ripper/__init__.py:__version__",
]

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "python-semantic-release>=10.6.1",
]
